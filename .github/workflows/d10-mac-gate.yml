name: D10 selected Mac gate contracts
on:
  push:
    branches: ['codex/**']
    paths:
      - '.github/workflows/d10-mac-gate.yml'
      - 'qualification/d10_mac.py'
      - 'qualification/test_d10_mac.py'
      - 'qualification/d10_mac_overlay.py'
      - 'qualification/test_d10_mac_overlay.py'
      - 'installer_assembly/constructor_runner.py'
      - 'installer_assembly/pkg_finalize.py'
      - 'installer_assembly/corresponding_source.py'
      - 'installer_assembly/supplements.py'
      - 'installer_assembly/tool-lock.json'
      - 'qualification/d06_delivery_record.py'
      - 'qualification/d06_upstream_source.py'
      - 'source-export/export_source.py'
      - 'recipes/stage_payload.py'
      - 'qualification/d09_platform.py'
      - 'qualification/host_platform.py'
      - 'qualification/native_campaign.py'
      - 'channel/install_qualification.py'
      - 'installer_assembly/carriers.py'
      - 'installer_assembly/construct.py'
      - 'installer_assembly/link_qualification.py'
      - 'installer_assembly/review_signing.py'
      - 'recipes/build_go_carriers.py'
      - 'recipes/go_generate.py'
      - 'lifecycle/go_delivery.py'
      - 'owner-catalog/native_owners.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d10-mac-contracts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Check selected Mac admission and preservation contracts only
        run: python3 -B -m unittest qualification.test_d10_mac qualification.test_d10_mac_overlay -v

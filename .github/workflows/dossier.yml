name: S08 dossier and source delivery
on:
  push:
    branches: ['main', 'codex/**']
    paths: ['.github/workflows/dossier.yml', 'README.md', 'docs/**', 'dossier/**', 'source-export/**', 'evidence/**', 'source-binding.json', 'go-owner-catalog.json', 'lifecycle/README.md']
  pull_request:
    paths: ['.github/workflows/dossier.yml', 'README.md', 'docs/**', 'dossier/**', 'source-export/**', 'evidence/**', 'source-binding.json', 'go-owner-catalog.json', 'lifecycle/README.md']
  workflow_dispatch:
    inputs:
      review_export:
        description: Prepare the verified export digests for native qualification
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: dossier-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  dossier:
    name: Source-bound dossier and export contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read exact reviewed core source
        id: source
        run: |
          python3 - <<'PY'
          import json, os, re
          source = json.load(open('source-binding.json'))['source_commit']
          assert re.fullmatch('[0-9a-f]{40}', source)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('commit=' + source + '\n')
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: QuanuX/Symphony
          ref: ${{ steps.source.outputs.commit }}
          path: work/core
          persist-credentials: false
      - name: Check source export and dossier refusal boundaries
        run: |
          python3 -m unittest discover -s source-export -p test_export_source.py -v
          python3 -m unittest discover -s source-export -p test_check_go_source.py -v
          python3 -m unittest discover -s dossier -p test_validate.py -v
      - name: Validate fresh candidate preparation without claiming qualification
        run: |
          python3 dossier/validate.py --source work/core --candidate-preparation
      - name: Prepare and verify corresponding source for the selected commit
        if: github.event_name == 'workflow_dispatch' && inputs.review_export
        env:
          PRIVATE_SOURCE_POLICY: ${{ secrets.SYMPHONY_SOURCE_PRIVACY_POLICY }}
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os, pathlib, sys
          sys.path[:0] = ['qualification', 'source-export']
          from d09_platform import write_private_policy
          import export_source

          runner = pathlib.Path(os.environ['RUNNER_TEMP'])
          policy = write_private_policy(runner / 'dossier-policy.json', os.environ.pop('PRIVATE_SOURCE_POLICY', ''))
          try:
              export_source.configure_policy(policy)
              checkout = pathlib.Path('work/core').resolve()
              output = runner / 'reviewed-source'
              export_source.build(checkout, output)
              proof = export_source.verify(output, checkout)
              proof['manifest_sha256'] = hashlib.sha256((output / 'SOURCE-EXPORT.json').read_bytes()).hexdigest()
              proof['source_commit'] = export_source.EXPECTED_COMMIT
              proof['source_tree'] = export_source.EXPECTED_TREE
              print(json.dumps(proof, sort_keys=True))
              (runner / 'source-export-proof.json').write_text(json.dumps(proof, indent=2) + '\n')
          finally:
              policy.unlink(missing_ok=True)
          PY
      - name: Retain verified source selection
        if: github.event_name == 'workflow_dispatch' && inputs.review_export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-export-proof
          path: ${{ runner.temp }}/source-export-proof.json
          if-no-files-found: error
          retention-days: 14

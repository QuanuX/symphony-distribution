name: D14 release signing and publication contracts
on:
  push:
    branches: ['main', 'codex/**']
    paths:
      - '.github/workflows/d14-release-contracts.yml'
      - 'channel/beta*.py'
      - 'channel/release_bundle.py'
      - 'channel/hosted_release_bundle.py'
      - 'channel/node_keyring/**'
      - 'channel/verify_beta.py'
      - 'channel/test_beta*.py'
      - 'channel/test_release_bundle.py'
      - 'channel/test_verify_beta.py'
      - 'installer_assembly/beta_signing.py'
      - 'evidence/beta2-publisher-decision.json'
      - 'evidence/beta21-publisher-decision.json'
  pull_request:
    paths:
      - '.github/workflows/d14-release-contracts.yml'
      - 'channel/beta*.py'
      - 'channel/release_bundle.py'
      - 'channel/hosted_release_bundle.py'
      - 'channel/node_keyring/**'
      - 'channel/verify_beta.py'
      - 'channel/test_beta*.py'
      - 'channel/test_release_bundle.py'
      - 'channel/test_verify_beta.py'
      - 'installer_assembly/beta_signing.py'
      - 'evidence/beta2-publisher-decision.json'
      - 'evidence/beta21-publisher-decision.json'
  workflow_dispatch:
    inputs:
      assemble_beta21:
        description: Assemble the unsigned beta.2.1 bundle from the nine committed final selections
        type: boolean
        required: false
        default: false
      reuse_beta21_node:
        description: Use the exact admitted node archive from aggregate run 44939485324
        type: boolean
        required: false
        default: false
      admit_beta21_node:
        description: Admit only the two optional Ubuntu 26.04 node packages from the pinned release asset
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: d14-release-contracts-${{ github.ref }}-${{ github.event_name }}-${{ inputs.admit_beta21_node && 'node' || 'release' }}
  cancel-in-progress: false
jobs:
  contracts:
    if: github.event_name != 'workflow_dispatch' || !inputs.admit_beta21_node || inputs.assemble_beta21
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Test exact release policy, signatures, immutable publication and source closure
        run: |
          python3 -B -m unittest discover -s channel -p 'test_beta*.py' -v
          python3 -B -m unittest discover -s channel -p test_release_bundle.py -v
          python3 -B -m unittest discover -s channel -p test_verify_beta.py -v
  bundle:
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && inputs.assemble_beta21 &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/beta-2-1') &&
      needs.contracts.result == 'success' &&
      (needs.node-supplement.result == 'success' || (inputs.reuse_beta21_node && needs.node-supplement.result == 'skipped'))
    needs: [contracts, node-supplement]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Retrieve the completed installer and maintenance evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B channel/hosted_release_bundle.py fetch "$RUNNER_TEMP/beta21-release"
      - name: Retrieve the node archive admitted by this run
        if: '!inputs.reuse_beta21_node'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive_name=$(gh api "repos/QuanuX/symphony-distribution/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired == false and (.name | test("^beta21-node-for-assembly-[0-9]+$")))] | sort_by(.id) | last | .name')
          [[ "$archive_name" =~ ^beta21-node-for-assembly-[0-9]+$ ]]
          gh run download "$GITHUB_RUN_ID" --repo QuanuX/symphony-distribution --name "$archive_name" --dir "$RUNNER_TEMP/beta21-release"
      - name: Retrieve the previously admitted node archive
        if: inputs.reuse_beta21_node
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}/beta21-release
        run: |
          set -euo pipefail
          # Run 44939485324, attempt 1, completed node admission job 136953321122.
          gh api repos/QuanuX/symphony-distribution/actions/artifacts/14720559408/zip > retained-node.zip
          echo '87bff0ec2be0ac6fdd3be5685cb6eeeb9f9655d802218436fab9e6f1c1fb7ba0  retained-node.zip' | sha256sum --check --status
          name=symphony-beta21-node-keyring-supplement.tar.gz
          unzip -p retained-node.zip "$name" > "$name"
          echo "eed4337e49ec8c7f770a9bd03d0a877a90b17dfb797a7f4d2faad33c2b936784  $name" | sha256sum --check --status
      - name: Prepare the pinned Conda archive reader
        run: python3 -B qualification/d09_platform_tools.py --profile ubuntu24.04-amd64 --output "$RUNNER_TEMP/beta21-tools"
      - name: Verify all profiles and assemble the public files
        env:
          PRIVATE_SOURCE_POLICY: ${{ secrets.SYMPHONY_SOURCE_PRIVACY_POLICY }}
        run: '"$RUNNER_TEMP/beta21-tools/publisher/bin/python" -B channel/hosted_release_bundle.py assemble "$RUNNER_TEMP/beta21-release"'
      - name: Retain verified public files for detached publisher signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beta21-unsigned-release-${{ github.run_attempt }}
          path: ${{ runner.temp }}/beta21-release/public/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  node-supplement:
    if: github.event_name == 'workflow_dispatch' && (inputs.admit_beta21_node || (inputs.assemble_beta21 && !inputs.reuse_beta21_node)) && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/beta-2-1')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    # Access to a draft release requires repository push rights on GitHub.
    # The fixed GETs below are the only operations that receive this token.
    permissions:
      contents: write
    steps:
      - name: Select the public workflow source without account credentials
        run: |
          git init --quiet
          git fetch --quiet --no-tags --depth=1 https://github.com/QuanuX/symphony-distribution.git "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Retrieve the exact optional Ubuntu node delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B channel/hosted_release_bundle.py fetch-supplement "$RUNNER_TEMP/beta21-node"
      - name: Prepare the selected archive reader
        run: python3 -B qualification/d09_platform_tools.py --profile ubuntu24.04-amd64 --output "$RUNNER_TEMP/beta21-node-tools"
      - name: Scan the expanded source, packages and qualification records
        env:
          PRIVATE_SOURCE_POLICY: ${{ secrets.SYMPHONY_SOURCE_PRIVACY_POLICY }}
        run: '"$RUNNER_TEMP/beta21-node-tools/publisher/bin/python" -B channel/hosted_release_bundle.py audit-supplement "$RUNNER_TEMP/beta21-node"'
      - name: Retain the optional admission receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beta21-node-admission-${{ github.run_attempt }}
          path: ${{ runner.temp }}/beta21-node/node-admission.json
          if-no-files-found: error
          retention-days: 14
      - name: Hand the admitted archive to this run's primary assembly
        if: inputs.assemble_beta21
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beta21-node-for-assembly-${{ github.run_attempt }}
          path: ${{ runner.temp }}/beta21-node/symphony-beta21-node-keyring-supplement.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

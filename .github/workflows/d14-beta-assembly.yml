name: D14 approved beta assembly from qualified bytes
on:
  push:
    branches: ['main', 'codex/**']
    paths:
      - '.github/workflows/d14-beta-assembly.yml'
      - 'installer_assembly/beta.py'
      - 'installer_assembly/test_beta.py'
      - 'installer_assembly/construct.py'
      - 'installer_assembly/test_construct.py'
      - 'qualification/primary_rewrap.py'
      - 'qualification/test_primary_rewrap.py'
      - 'delivery/bootstrap.py'
      - 'delivery/test_bootstrap.py'
  workflow_dispatch:
    inputs:
      selection:
        description: Committed evidence/beta-selections/*.json selecting completed package and client runs
        type: string
        required: true
      selection_sha256:
        description: Exact selection JSON SHA256
        type: string
        required: true
      authorization:
        description: Exact committed published-beta decision or beta2 review authorization
        type: choice
        options:
          - evidence/d14-publisher-decision.json
          - evidence/beta2-candidate.json
        default: evidence/d14-publisher-decision.json
        required: true
permissions:
  contents: read
concurrency:
  group: d14-beta-${{ github.ref }}-${{ inputs.selection || 'contracts' }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      profile: ${{ steps.selected.outputs.profile }}
      runner: ${{ steps.selected.outputs.runner }}
      core: ${{ steps.selected.outputs.core }}
      client: ${{ steps.selected.outputs.client }}
      decision_sha256: ${{ steps.selected.outputs.decision_sha256 }}
      authorization: ${{ steps.selected.outputs.authorization }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Check affected beta assembly and constructor contracts
        run: |
          python3 -B -m unittest discover -s installer_assembly -p 'test_beta.py' -v
          python3 -B -m unittest discover -s installer_assembly -p 'test_construct.py' -v
          python3 -B -m unittest qualification.test_primary_rewrap -v
          python3 -B -m unittest discover -s delivery -p 'test_bootstrap.py' -v
      - name: Admit exact committed publisher and artifact selections
        if: github.event_name == 'workflow_dispatch'
        id: selected
        env:
          SELECTION: ${{ inputs.selection }}
          SELECTION_SHA256: ${{ inputs.selection_sha256 }}
          AUTHORIZATION: ${{ inputs.authorization }}
        run: |
          python3 - <<'PYCODE'
          import hashlib, os, pathlib, re, subprocess, sys
          from qualification.beta_artifacts import validate_selection
          sys.path.insert(0, 'qualification')
          from qualification.d09_platform_tools import TARGETS
          sys.path.insert(0, 'installer_assembly')
          from construct import beta_authorization
          name = os.environ['SELECTION']
          assert re.fullmatch(r'evidence/beta-selections/[a-z0-9][a-z0-9._-]*\.json', name)
          assert pathlib.Path(name).read_bytes() == subprocess.check_output(['git', 'show', os.environ['GITHUB_SHA'] + ':' + name])
          selected = validate_selection(pathlib.Path(name), os.environ['SELECTION_SHA256'])
          assert set(selected['artifacts']) == {'package', 'client'}
          authority = os.environ['AUTHORIZATION']
          expected = {'evidence/d14-publisher-decision.json': ('symphony.distribution.beta-publisher-decision.v1', '0.2.0-beta.1'),
                      'evidence/beta2-candidate.json': ('symphony.distribution.beta-candidate-authorization.v1', '0.2.0-beta.2')}
          assert authority in expected, 'Unselected assembly authority path'
          decision = pathlib.Path(authority).resolve()
          raw = decision.read_bytes()
          assert raw == subprocess.check_output(['git', 'show', os.environ['GITHUB_SHA'] + ':' + authority])
          digest = hashlib.sha256(raw).hexdigest()
          accepted = beta_authorization(decision, digest, selected['profile'])['decision']
          assert (accepted['protocol'], accepted['release_version']) == expected[authority], 'Assembly authority path or scope differs'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('profile=' + selected['profile'] + '\nrunner=' + TARGETS[selected['profile']][0] + '\n')
              out.write('core=' + accepted['source_binding']['core_commit'] + '\nclient=' + accepted['source_binding']['client_commit'] + '\n')
              out.write('decision_sha256=' + digest + '\n')
              out.write('authorization=' + authority + '\n')
          PYCODE
  assemble:
    if: github.event_name == 'workflow_dispatch'
    needs: contracts
    runs-on: ${{ needs.contracts.outputs.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      PROFILE: ${{ needs.contracts.outputs.profile }}
      SELECTION: ${{ inputs.selection }}
      SELECTION_SHA256: ${{ inputs.selection_sha256 }}
      DECISION_SHA256: ${{ needs.contracts.outputs.decision_sha256 }}
      AUTHORIZATION: ${{ needs.contracts.outputs.authorization }}
      GOWORK: 'off'
      GOENV: 'off'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: QuanuX/Symphony
          ref: ${{ needs.contracts.outputs.core }}
          path: work/core
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: QuanuX/symphony-codex-ipc-mcp-and-skills
          ref: ${{ needs.contracts.outputs.client }}
          path: work/client
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: false
      - name: Select source-only module caches
        run: |
          echo "GOMODCACHE=$RUNNER_TEMP/d14-gomodcache" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/d14-go-cache" >> "$GITHUB_ENV"
      - name: Retrieve exact successful native and client qualifications
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B -m qualification.beta_artifacts fetch --selection "$SELECTION" \
            --selection-sha256 "$SELECTION_SHA256" --output "$RUNNER_TEMP/d14-input" --gh "$(command -v gh)"
      - name: Prepare isolated pinned packaging tools
        run: python3 -B qualification/d09_platform_tools.py --profile "$PROFILE" --output "$RUNNER_TEMP/d14-tools"
      - name: Restore original evidence for corresponding source without compilation
        env:
          PRIVATE_SOURCE_POLICY: ${{ secrets.SYMPHONY_SOURCE_PRIVACY_POLICY }}
        run: |
          python3 - <<'PYCODE'
          import hashlib, os, pathlib, subprocess
          from qualification.d09_platform import write_private_policy
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          policy = write_private_policy(root / 'd14-policy.json', os.environ.pop('PRIVATE_SOURCE_POLICY'))
          inputs = root / 'd14-input/artifacts/package/inputs'
          selection = inputs / 'selection.json'
          subprocess.run([str(root / 'd14-tools/publisher/bin/python'), '-B', 'qualification/native_rewrap.py', 'restore',
              '--selection', str(selection), '--selection-sha256', hashlib.sha256(selection.read_bytes()).hexdigest(),
              '--artifact', str(inputs), '--transport-proof', str(inputs / 'transport-proof.json'),
              '--repository', str(pathlib.Path('work/core').resolve()), '--privacy-policy', str(policy),
              '--output', str(root / 'd14-restored')], check=True)
          PYCODE
      - name: Prepare pinned Go source dependencies
        run: |
          test "$(go env GOVERSION)" = go1.26.5
          python3 -B qualification/d06_prepare_go.py --source "$GITHUB_WORKSPACE/work/core" \
            --work "$RUNNER_TEMP/d14-go-preparation" --go "$(command -v go)" --gomodcache "$GOMODCACHE"
      - name: Retrieve exact external corresponding sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/d14-archives"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 300 \
            https://curl.se/download/curl-8.7.1.tar.xz --output "$RUNNER_TEMP/d14-archives/curl-8.7.1.tar.xz"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 300 \
            https://github.com/meta/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz --output "$RUNNER_TEMP/d14-archives/zstd-1.5.7.tar.gz"
      - name: Recollect exact corresponding sources and notices only
        run: |
          python3 -B qualification/d06_delivery_record.py \
            --build-root "$RUNNER_TEMP/d14-restored/restored/cohort" --repository "$GITHUB_WORKSPACE/work/core" \
            --go "$(command -v go)" --gomodcache "$GOMODCACHE" --external-sources "$RUNNER_TEMP/d14-archives" \
            --external-build-report "$RUNNER_TEMP/d14-restored/restored/external/external-build.json" \
            --export "$RUNNER_TEMP/d14-restored/restored/export" --privacy-policy "$RUNNER_TEMP/d14-policy.json" \
            --output "$RUNNER_TEMP/d14-delivery"
      - name: Assemble approved beta and qualify final59 maintenance and fresh shell installation
        run: |
          "$RUNNER_TEMP/d14-tools/publisher/bin/python" -B installer_assembly/beta.py \
            --artifact "$RUNNER_TEMP/d14-input" --selection "$SELECTION" --selection-sha256 "$SELECTION_SHA256" \
            --publisher-decision "$GITHUB_WORKSPACE/$AUTHORIZATION" --publisher-decision-sha256 "$DECISION_SHA256" \
            --repository "$GITHUB_WORKSPACE/work/core" --client-repository "$GITHUB_WORKSPACE/work/client" \
            --delivery "$RUNNER_TEMP/d14-delivery" --privacy-policy "$RUNNER_TEMP/d14-policy.json" \
            --output "$RUNNER_TEMP/d14-beta" --toolkit-commit "$GITHUB_SHA" \
            --python "$RUNNER_TEMP/d14-tools/publisher/bin/python" \
            --standalone "$RUNNER_TEMP/d14-tools/publisher/standalone_conda/conda.exe" \
            --standalone-archive "$RUNNER_TEMP/d14-tools/downloads/standalone.conda"
      - name: Retain completed beta carriers installers and optional sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d14-beta-assembly-${{ needs.contracts.outputs.profile }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/d14-beta/artifact/
          if-no-files-found: error
          retention-days: 30
      - name: Retain bounded assembly evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d14-beta-status-${{ needs.contracts.outputs.profile }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/d14-input/transport-proof.json
            ${{ runner.temp }}/d14-beta/INCOMPLETE.json
            ${{ runner.temp }}/d14-tools/failure.json
            ${{ runner.temp }}/d14-delivery/delivery-record.json
          if-no-files-found: warn
          retention-days: 14

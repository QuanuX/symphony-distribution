  <text x="64" y="164" fill="#f6f7f8" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="700">Standalone Installers &amp; Conda Channel</text>
  <text x="64" y="192" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5">• <tspan fill="#f6f7f8" font-weight="600">Signature &amp; Cohort Check:</tspan> Verify detached signature and</text>
  <text x="76" y="212" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5">exact OS profile list (<tspan fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace">24.04</tspan> vs <tspan fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace">26.04</tspan> AMD64 differ).</text>
  <text x="64" y="238" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5">• <tspan fill="#f6f7f8" font-weight="600">First-Use Retention:</tspan> Retain copies outside Conda prefixes</text>
  <text x="76" y="258" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5">and caches; configure Codex or other client adapters.</text>
  <text x="64" y="284" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5">• <tspan fill="#f6f7f8" font-weight="600">Prefix Isolation:</tspan> Use a fresh private installation prefix</text>
  <text x="76" y="304" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5">and retention directory; keep older releases separate.</text>


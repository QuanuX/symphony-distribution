  <text x="516" y="258" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5"><tspan fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace">26.10.0</tspan>, and <tspan fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace">conda-build 26.9.1</tspan> publisher environment.</text>
  <text x="504" y="284" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5">• <tspan fill="#f6f7f8" font-weight="600">Prepared Transactions:</tspan> Validates complete LINK/UNLINK</text>

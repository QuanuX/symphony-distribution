<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 920" width="100%" height="100%">
  <defs>
    <linearGradient id="spectralBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#72f6ff"/>
      <stop offset="25%" stop-color="#8f7cff"/>
      <stop offset="50%" stop-color="#ff69c6"/>
      <stop offset="75%" stop-color="#ffb45f"/>
      <stop offset="100%" stop-color="#d7ff69"/>
    </linearGradient>
    <linearGradient id="spectralWord" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbfbfb"/>
      <stop offset="28%" stop-color="#72f6ff"/>
      <stop offset="52%" stop-color="#8f7cff"/>
      <stop offset="76%" stop-color="#ff69c6"/>
      <stop offset="100%" stop-color="#d7ff69"/>
    </linearGradient>
    <linearGradient id="dividerRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e2227"/>
      <stop offset="20%" stop-color="#72f6ff"/>
      <stop offset="40%" stop-color="#8f7cff"/>
      <stop offset="60%" stop-color="#ff69c6"/>
      <stop offset="80%" stop-color="#d7ff69"/>
      <stop offset="100%" stop-color="#1e2227"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="78%" cy="14%" r="45%">
      <stop offset="0%" stop-color="#8f7cff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050607" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer Frame -->
  <rect width="960" height="920" fill="#050607" stroke="#1e2227" stroke-width="2"/>
  <rect width="960" height="920" fill="url(#heroGlow)"/>

  <!-- Top Spectral Bar -->
  <rect x="1" y="1" width="958" height="4" fill="url(#spectralBar)"/>

  <!-- Topbar Header -->
  <line x1="1" y1="84" x2="959" y2="84" stroke="#1e2227" stroke-width="1"/>

  <!-- BrandMark Q -->
  <rect x="40" y="24" width="38" height="38" rx="9" fill="#080a0b" stroke="#72f6ff" stroke-width="1.2"/>
  <text x="59" y="49" fill="#f6f7f8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="900" text-anchor="middle">Q</text>
  <text x="90" y="41" fill="#f6f7f8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" letter-spacing="-0.5">QuanuX</text>
  <text x="90" y="57" fill="#858b92" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" letter-spacing="3">VENTURES</text>

  <!-- Status Pill -->
  <rect x="594" y="26" width="326" height="34" rx="17" fill="#0b0d0f" stroke="#262b31" stroke-width="1"/>
  <circle cx="614" cy="43" r="4" fill="#d7ff69"/>
  <text x="628" y="47" fill="#dfe4e8" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" letter-spacing="1.1">SIGNED COHORT // v0.2.0-beta.2</text>

  <!-- Hero Eyebrow -->
  <text x="40" y="132" fill="#72f6ff" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" letter-spacing="2">QUANUX/BETA ON ANACONDA // CLOUDFLARE STANDALONE INSTALLERS</text>
  <text x="40" y="160" fill="#858b92" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="2.4">SYMPHONY PUBLIC BETA DISTRIBUTION</text>

  <!-- Hero Title -->
  <text x="40" y="222" fill="url(#spectralWord)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="60" font-weight="800" letter-spacing="-2.3">Symphony Beta.2</text>

  <!-- Hero Kicker -->
  <text x="40" y="266" fill="#f6f7f8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.4">Independently maintainable packages, clean CI native builds,</text>
  <text x="40" y="295" fill="#f6f7f8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.4">and signed platform installers for Symphony quantOS.</text>

  <!-- Hero Description -->
  <text x="40" y="340" fill="#b6bbc0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">Symphony is a quantOS developed through <tspan fill="#f6f7f8" font-weight="700">VGAA (Vector-Graph Application Architecture)</tspan>, where users compose</text>
  <text x="40" y="363" fill="#b6bbc0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">their own environments from independently maintained modules. <tspan fill="#72f6ff">Symphony 0.2.0-beta.2</tspan> binds <tspan fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace">240</tspan> published</text>
  <text x="40" y="386" fill="#b6bbc0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">Conda packages and <tspan fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace">304</tspan> verified download objects to a signed release across four OS profiles—delivering inert</text>
  <text x="40" y="409" fill="#b6bbc0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">package carriers while preserving explicit Symphony owner custody, credentials, and Maestro selection.</text>

  <!-- 4-Column Telemetry Strip -->
  <rect x="40" y="436" width="880" height="76" fill="#080a0b" stroke="#1e2227" stroke-width="1"/>
  <line x1="260" y1="436" x2="260" y2="512" stroke="#1e2227" stroke-width="1"/>
  <line x1="480" y1="436" x2="480" y2="512" stroke="#1e2227" stroke-width="1"/>
  <line x1="700" y1="436" x2="700" y2="512" stroke="#1e2227" stroke-width="1"/>

  <text x="56" y="462" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10" letter-spacing="1.2">PUBLISHED COHORT</text>
  <text x="56" y="483" fill="#f6f7f8" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5" font-weight="700">240 Conda Packages</text>
  <text x="56" y="500" fill="#f6f7f8" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5" font-weight="700">59 Default / Profile</text>

  <text x="276" y="462" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10" letter-spacing="1.2">SIGNED ARTIFACTS</text>
  <text x="276" y="483" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5" font-weight="700">304 Download Objects</text>
  <text x="276" y="500" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5" font-weight="700">Detached Publisher Sig</text>

  <text x="496" y="462" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10" letter-spacing="1.2">MAINTENANCE QUAL</text>
  <text x="496" y="483" fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5" font-weight="700">728 Packaging Txns</text>
  <text x="496" y="500" fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5" font-weight="700">0-&gt;1-&gt;0 &amp; Recovery</text>

  <text x="716" y="462" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10" letter-spacing="1.2">HOST &amp; CLIENT CASES</text>
  <text x="716" y="483" fill="#ff69c6" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5" font-weight="700">88 Codex Cases</text>
  <text x="716" y="500" fill="#ff69c6" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5" font-weight="700">204 Owner Receipts</text>

  <!-- Terminal Window -->
  <rect x="40" y="544" width="880" height="330" rx="10" fill="#080a0b" stroke="#262b31" stroke-width="1.2"/>
  <rect x="41" y="545" width="878" height="42" rx="9" fill="#0b0d0f"/>
  <line x1="40" y1="587" x2="920" y2="587" stroke="#1e2227" stroke-width="1"/>

  <!-- Traffic Lights -->
  <circle cx="62" cy="566" r="4.5" fill="#ff6d71"/>
  <circle cx="76" cy="566" r="4.5" fill="#ffd35f"/>
  <circle cx="90" cy="566" r="4.5" fill="#6fe787"/>

  <text x="480" y="570" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" letter-spacing="1" text-anchor="middle">symphony-distribution // platform installers &amp; source binding</text>
  <text x="900" y="570" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" letter-spacing="1.2" text-anchor="end">● BETA.2 VERIFIED</text>

  <!-- Terminal Command -->
  <text x="64" y="618" fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace" font-size="12.5">$</text>
  <text x="80" y="618" fill="#f6f7f8" font-family="'SFMono-Regular', Consolas, monospace" font-size="12.5">python3 tests/check_source_binding.py "$SYMPHONY_SCOPE_TEST_SOURCE"</text>
  <text x="64" y="640" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="11"># Verifying exact OS profile selection, detached signature binding, and 59 default packages + optional source</text>

  <!-- Terminal Table -->
  <rect x="64" y="658" width="832" height="192" fill="#080a0b" stroke="#1e2227" stroke-width="1"/>
  <rect x="65" y="659" width="830" height="36" fill="#0b0d0f"/>
  <line x1="64" y1="695" x2="896" y2="695" stroke="#1e2227" stroke-width="1"/>
  <line x1="64" y1="734" x2="896" y2="734" stroke="#181c20" stroke-width="1"/>
  <line x1="64" y1="773" x2="896" y2="773" stroke="#181c20" stroke-width="1"/>
  <line x1="64" y1="812" x2="896" y2="812" stroke="#181c20" stroke-width="1"/>

  <text x="80" y="681" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" letter-spacing="0.8">PACKAGE SELECTION</text>
  <text x="276" y="681" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" letter-spacing="0.8">SUPPORTED PROFILE &amp; STANDALONE INSTALLERS</text>
  <text x="880" y="681" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" letter-spacing="0.8" text-anchor="end">RELEASE</text>

  <!-- Row 1 -->
  <text x="80" y="719" fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">macos15-arm64</text>
  <text x="276" y="719" fill="#d8dcdf" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">macOS 15 Apple Silicon · .pkg and .sh · 59 default pkgs + source</text>
  <text x="880" y="719" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" letter-spacing="1.2" text-anchor="end">SIGNED</text>

  <!-- Row 2 -->
  <text x="80" y="758" fill="#8f7cff" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">ubuntu24.04-amd64</text>
  <text x="276" y="758" fill="#d8dcdf" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">Ubuntu 24.04 AMD64 · .sh · Distinct qualified 24.04 AMD64 cohort</text>
  <text x="880" y="758" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" letter-spacing="1.2" text-anchor="end">SIGNED</text>

  <!-- Row 3 -->
  <text x="80" y="797" fill="#ff69c6" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">ubuntu24.04-arm64</text>
  <text x="276" y="797" fill="#d8dcdf" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">Ubuntu 24.04 ARM64 · .sh · Clean CI native &amp; SDK module exports</text>
  <text x="880" y="797" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" letter-spacing="1.2" text-anchor="end">SIGNED</text>

  <!-- Row 4 -->
  <text x="80" y="836" fill="#ffb45f" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">ubuntu26.04-amd64</text>
  <text x="276" y="836" fill="#d8dcdf" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">Ubuntu 26.04 AMD64 · .sh · Distinct qualified 26.04 AMD64 cohort</text>
  <text x="880" y="836" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" letter-spacing="1.2" text-anchor="end">SIGNED</text>

  <!-- Bottom Spectral Divider -->
  <rect x="40" y="902" width="880" height="1.5" fill="url(#dividerRule)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1160" width="100%" height="100%">
  <defs>
    <linearGradient id="dividerRule2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e2227"/>
      <stop offset="20%" stop-color="#72f6ff"/>
      <stop offset="40%" stop-color="#8f7cff"/>
      <stop offset="60%" stop-color="#ff69c6"/>
      <stop offset="80%" stop-color="#d7ff69"/>
      <stop offset="100%" stop-color="#1e2227"/>
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect width="960" height="1160" fill="#050607" stroke="#1e2227" stroke-width="2"/>

  <!-- SECTION 01: CARRIER SEPARATION & RUNTIME CUSTODY -->
  <text x="40" y="48" fill="#858b92" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="2">01 // INERT CARRIER DELIVERY &amp; EXPLICIT OWNER CUSTODY</text>
  <text x="40" y="88" fill="#f6f7f8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="31" font-weight="700" letter-spacing="-1">Inert Carrier Delivery with <tspan fill="#72f6ff">Sovereign Local Retention.</tspan></text>

  <text x="40" y="124" fill="#b6bbc0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">Packages contain inert carrier files: installing them never activates live services, alters system trust, or</text>
  <text x="40" y="147" fill="#f6f7f8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600">replaces Maestro selection. Existing Symphony owners retain control of runtime files, credentials, and retirement,</text>
  <text x="40" y="170" fill="#b6bbc0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">while independent retained copies outside Conda prefixes and caches survive carrier upgrade or removal. Profiles,</text>
  <text x="40" y="193" fill="#b6bbc0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">credentials, hardware knowledge, and workflow state are created locally on the recipient's system.</text>

  <!-- SECTION 02: THE 6 DISTRIBUTION PILLARS -->
  <text x="40" y="242" fill="#858b92" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="2">02 // PACKAGING ARCHITECTURE, MAINTENANCE &amp; TRUST BOUNDARIES</text>

  <!-- 2x3 Grid Container -->
  <rect x="40" y="262" width="880" height="585" fill="#080a0b" stroke="#1e2227" stroke-width="1"/>
  <line x1="480" y1="262" x2="480" y2="847" stroke="#1e2227" stroke-width="1"/>
  <line x1="40" y1="457" x2="920" y2="457" stroke="#1e2227" stroke-width="1"/>
  <line x1="40" y1="652" x2="920" y2="652" stroke="#1e2227" stroke-width="1"/>

  <!-- PILLAR 01 -->
  <text x="64" y="292" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5">PILLAR 01</text>
  <text x="456" y="292" fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" text-anchor="end">59 PKGS // + SOURCE</text>
  <text x="64" y="320" fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" letter-spacing="1.4">PER-PROFILE MODULAR COHORTS</text>
  <text x="64" y="346" fill="#f6f7f8" font-family="Inter, -apple-system, sans-serif" font-size="18.5" font-weight="700">Independent Module Lifecycle</text>
  <text x="64" y="374" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">Each OS profile supplies <tspan fill="#f6f7f8" font-weight="600">59 independently maintainable</tspan></text>
  <text x="64" y="394" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13"><tspan fill="#f6f7f8" font-weight="600">default packages</tspan> plus an optional corresponding-source</text>
  <text x="64" y="414" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">package. SDK headers, libraries, and exports stay with their</text>
  <text x="64" y="434" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">module owners for per-module install, swap, and removal.</text>

  <!-- PILLAR 02 -->
  <text x="504" y="292" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5">PILLAR 02</text>
  <text x="896" y="292" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" text-anchor="end">240 PKGS // 304 OBJECTS</text>
  <text x="504" y="320" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" letter-spacing="1.4">SIGNED PUBLICATION RECORD</text>
  <text x="504" y="346" fill="#f6f7f8" font-family="Inter, -apple-system, sans-serif" font-size="18.5" font-weight="700">Anaconda &amp; Cloudflare Verification</text>
  <text x="504" y="374" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">Published via <tspan fill="#f6f7f8" font-weight="600">QuanuX/beta on Anaconda</tspan> and Cloudflare</text>
  <text x="504" y="394" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">downloads. <tspan fill="#f6f7f8" font-family="'SFMono-Regular', Consolas, monospace">evidence/beta2-publication.json</tspan> binds</text>
  <text x="504" y="414" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13"><tspan fill="#f6f7f8" font-weight="600">240 packages</tspan> and <tspan fill="#f6f7f8" font-weight="600">304 verified download objects</tspan> to the</text>
  <text x="504" y="434" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">pinned self-signed detached publisher signature.</text>

  <!-- PILLAR 03 -->
  <text x="64" y="487" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5">PILLAR 03</text>
  <text x="456" y="487" fill="#ffb45f" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" text-anchor="end">BETA.2 // 3 REPAIRS</text>
  <text x="64" y="515" fill="#ffb45f" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" letter-spacing="1.4">LIFECYCLE &amp; CUSTODY HARDENING</text>
  <text x="64" y="541" fill="#f6f7f8" font-family="Inter, -apple-system, sans-serif" font-size="18.5" font-weight="700">Verified Beta.2 Maintenance Fixes</text>
  <text x="64" y="569" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">Dependency replacements complete before new dependents</text>
  <text x="64" y="589" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">install; retrying a verified completed scoped close preserves</text>
  <text x="64" y="609" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">durable state; and installed <tspan fill="#f6f7f8" font-weight="600">SSIAG</tspan> and <tspan fill="#f6f7f8" font-weight="600">Accordare</tspan> owners</text>
  <text x="64" y="629" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">safely reinstall under exclusive target custody.</text>

  <!-- PILLAR 04 -->
  <text x="504" y="487" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5">PILLAR 04</text>
  <text x="896" y="487" fill="#ff69c6" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" text-anchor="end">0-&gt;1-&gt;0 // RECOVERY</text>
  <text x="504" y="515" fill="#ff69c6" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" letter-spacing="1.4">QUALIFIED SCOPE &amp; TRUST LIMITS</text>
  <text x="504" y="541" fill="#f6f7f8" font-family="Inter, -apple-system, sans-serif" font-size="18.5" font-weight="700">Explicit Revision &amp; Prefix Isolation</text>
  <text x="504" y="569" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">Qualifies packaging revision <tspan fill="#f6f7f8" font-weight="600">0-&gt;1-&gt;0</tspan> upgrade/rollback and</text>
  <text x="504" y="589" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">same-candidate recovery. Install beta.2 into a <tspan fill="#f6f7f8" font-weight="600">new private</tspan></text>
  <text x="504" y="609" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13"><tspan fill="#f6f7f8" font-weight="600">prefix</tspan>; Apple Developer ID, notarization, Gatekeeper, and</text>
  <text x="504" y="629" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">cross-native-release upgrades are not claimed.</text>

  <!-- PILLAR 05 -->
  <text x="64" y="682" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5">PILLAR 05</text>
  <text x="456" y="682" fill="#8f7cff" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" text-anchor="end">7 GO UNITS // GO 1.26.5</text>
  <text x="64" y="710" fill="#8f7cff" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" letter-spacing="1.4">PINNED SOURCE &amp; OWNER CATALOG</text>
  <text x="64" y="736" fill="#f6f7f8" font-family="Inter, -apple-system, sans-serif" font-size="18.5" font-weight="700">Deterministic Source-Hash Binding</text>
  <text x="64" y="764" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">Binds exact core commit and source-file hashes in</text>
  <text x="64" y="784" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13"><tspan fill="#f6f7f8" font-family="'SFMono-Regular', Consolas, monospace">source-binding.json</tspan> and seven Go delivery routes in</text>
  <text x="64" y="804" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13"><tspan fill="#f6f7f8" font-family="'SFMono-Regular', Consolas, monospace">go-owner-catalog.json</tspan> with pinned <tspan fill="#f6f7f8" font-weight="600">Go 1.26.5</tspan> recipes.</text>
  <text x="64" y="824" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">New builds never silently replace signed release bytes.</text>

  <!-- PILLAR 06 -->
  <text x="504" y="682" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5">PILLAR 06</text>
  <text x="896" y="682" fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" text-anchor="end">S06 -&gt; D14 // DOSSIER</text>
  <text x="504" y="710" fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" letter-spacing="1.4">AUDITABLE MILESTONE LINEAGE</text>
  <text x="504" y="736" fill="#f6f7f8" font-family="Inter, -apple-system, sans-serif" font-size="18.5" font-weight="700">Preserved Evidence &amp; Source Export</text>
  <text x="504" y="764" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">Retains complete <tspan fill="#f6f7f8" font-weight="600">S06–S08</tspan> and <tspan fill="#f6f7f8" font-weight="600">D06–D14</tspan> milestone records,</text>
  <text x="504" y="784" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">clean cohort provenance, privacy-audited source export,</text>
  <text x="504" y="804" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">and historical <tspan fill="#f6f7f8" font-weight="600">0.2.0-beta.1</tspan> artifacts alongside the</text>
  <text x="504" y="824" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="13">completed <tspan fill="#f6f7f8" font-weight="600">0.2.0-beta.2</tspan> publisher decision and retrieval.</text>

  <!-- SECTION 03: IMMUTABLE SOURCE CHECKPOINT MATRIX -->
  <rect x="40" y="876" width="880" height="248" fill="#080a0b" stroke="#1e2227" stroke-width="1"/>
  <text x="64" y="908" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" letter-spacing="1.8">03 // BETA.2 SOURCE CHECKPOINTS &amp; IMMUTABLE COMMIT IDENTITIES</text>
  <text x="64" y="936" fill="#f6f7f8" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.4">Feature Freeze in Force · Tag &amp; Signed Artifact Identities Are Immutable</text>

  <line x1="64" y1="954" x2="896" y2="954" stroke="#1e2227" stroke-width="1"/>
  <line x1="64" y1="1008" x2="896" y2="1008" stroke="#1e2227" stroke-width="1"/>
  <line x1="64" y1="1062" x2="896" y2="1062" stroke="#1e2227" stroke-width="1"/>

  <text x="64" y="985" fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" letter-spacing="1">NATIVE BUILD REV</text>
  <text x="255" y="985" fill="#d8dcdf" font-family="'SFMono-Regular', Consolas, monospace" font-size="12"><tspan fill="#f6f7f8" font-weight="700">bae2e817120467561ae051c1b08cf61be3436bac</tspan> · Pinned in source-binding.json</text>

  <text x="64" y="1039" fill="#8f7cff" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" letter-spacing="1">TAGGED CHECKPOINT</text>
  <text x="255" y="1039" fill="#d8dcdf" font-family="'SFMono-Regular', Consolas, monospace" font-size="12"><tspan fill="#f6f7f8" font-weight="700">8a6889597eef3d2713f48bf6962456f989188e18</tspan> · v0.2.0-beta.2 (README text only)</text>

  <text x="64" y="1093" fill="#ff69c6" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" letter-spacing="1">CLIENT SOURCE REV</text>
  <text x="255" y="1093" fill="#d8dcdf" font-family="'SFMono-Regular', Consolas, monospace" font-size="12"><tspan fill="#f6f7f8" font-weight="700">572627e939250763756167a9dc05d8cb37ab4e30</tspan> · Unchanged qualified client source</text>

  <!-- Bottom Spectral Divider -->
  <rect x="40" y="1144" width="880" height="1.5" fill="url(#dividerRule2)"/>
</svg>
